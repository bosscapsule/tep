<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Portal</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Test Portal" />
    <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/192/brain.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/scr/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const isLocalDevelopment = ['localhost', '127.0.0.1'].includes(window.location.hostname);
          if (isLocalDevelopment) {
            navigator.serviceWorker.getRegistrations()
              .then((registrations) => Promise.all(registrations.map((registration) => registration.unregister())))
              .then(() => caches.keys())
              .then((cacheNames) => Promise.all(cacheNames.map((cacheName) => caches.delete(cacheName))))
              .catch((err) => console.warn('Failed to clear local service worker cache:', err));
            return;
          }

          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('ServiceWorker registered:', reg.scope))
            .catch((err) => console.log('ServiceWorker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
