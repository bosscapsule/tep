appId: com.anatomyzh.desktop
productName: Test Portal
artifactName: Academic-3D-Test-Portal-${arch}-Setup-${version}.${ext}
icon: build/app-icon.ico
asar: true
compression: maximum
removePackageScripts: true
electronLanguages:
  - en-US
  - ru
  - uz
directories:
  output: "test portal"
files:
  - dist/**/*
  - electron-main.cjs
  - electron-security.cjs
  - preload.js
  - package.json
publish:
  provider: github
  owner: bosscapsule
  repo: test-portal
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  sign: null
  signAndEditExecutable: false
  signDlls: false
nsis:
  oneClick: false
  installerIcon: build/installer-icon.ico
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Test Portal
  uninstallDisplayName: Academic 3D Test Portal
  allowElevation: true
  perMachine: true
